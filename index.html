<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a237e">
<meta name="mobile-web-app-capable" content="yes">
<title>Каталог оптовых цен</title>
<style>
:root { --primary:#1a237e; --pl:#314796; --bg:#f4f6f9; --white:#fff; --text:#333; --border:#ddd; --danger:#d32f2f; --ok:#388e3c; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); padding-bottom:90px; }
.hidden { display:none !important; }
header { background:var(--primary); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; }
header h1 { margin:0; font-size:19px; }
.subtitle { font-size:11px; opacity:.9; margin-top:3px; }
.back-btn { background:none; border:none; color:#fff; font-size:26px; cursor:pointer; padding:0 6px; }
.top-bar { display:flex; gap:10px; margin:10px; }
.btn-nav { background:var(--white); color:var(--primary); padding:12px 14px; border-radius:12px; display:flex; align-items:center; gap:8px; font-weight:700; box-shadow:0 2px 5px rgba(0,0,0,.08); flex:1; justify-content:center; border:none; cursor:pointer; font-size:15px; }
.badge { background:#f0a500; color:#333; border-radius:12px; padding:1px 8px; font-size:13px; min-width:22px; text-align:center; }
.controls { display:flex; gap:10px; margin:0 10px 10px; }
.controls select, .controls input { padding:11px; border:1px solid var(--border); border-radius:12px; flex:1; min-width:130px; font-size:15px; background:var(--white); }
.product-list { padding:0 10px; }
.pcard { background:var(--white); border-radius:14px; padding:12px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.07); display:flex; gap:10px; align-items:center; }
.pimg { width:50px; height:50px; background:#eceff3; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:22px; }
.pinfo { flex:1; min-width:0; }
.pname { font-size:14px; font-weight:700; line-height:1.3; }
.pcat { font-size:11px; color:#777; margin-top:2px; }
.pprice { font-size:16px; font-weight:800; color:var(--primary); margin-top:3px; }
.rcol { display:flex; flex-direction:column; align-items:flex-end; gap:7px; }
.qty { display:flex; align-items:center; gap:5px; }
.qbtn { width:32px; height:32px; border-radius:9px; border:1.5px solid var(--primary); background:#fff; color:var(--primary); font-weight:800; font-size:17px; cursor:pointer; }
.qin { width:44px; height:32px; text-align:center; border:1.5px solid var(--primary); border-radius:9px; font-size:14px; font-weight:700; }
.addbtn { background:var(--primary); color:#fff; border:none; padding:9px 16px; border-radius:10px; font-weight:700; cursor:pointer; font-size:13px; }
.morebtn { display:block; width:calc(100% - 20px); margin:6px 10px 0; padding:12px; border-radius:12px; border:1.5px dashed var(--primary); background:#fff; color:var(--primary); font-weight:700; cursor:pointer; }
.status { text-align:center; color:#777; padding:40px 20px; }
.toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--primary); color:#fff; padding:10px 22px; border-radius:22px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:2000; }
.toast.show { opacity:1; }
.fab { position:fixed; bottom:20px; right:20px; width:54px; height:54px; background:var(--primary); color:#fff; border-radius:50%; border:none; font-size:22px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.3); z-index:900; }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1500; display:none; }
.overlay.active { display:block; }
.modal { position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:20px 20px 0 0; padding:20px; max-height:80vh; overflow-y:auto; z-index:1600; transform:translateY(110%); transition:transform .25s; }
.modal.active { transform:none; }
.modal h3 { margin:0 0 14px; color:var(--primary); }
.mclose { position:absolute; top:10px; right:12px; background:none; border:none; font-size:24px; cursor:pointer; color:#999; }
.fg { margin-bottom:12px; }
.fg label { display:block; margin-bottom:4px; font-size:13px; color:#555; }
.fg input, .fg select { width:100%; padding:10px; border:1px solid var(--border); border-radius:10px; font-size:15px; }
.mbtn { width:100%; padding:13px; background:var(--primary); color:#fff; border:none; border-radius:12px; font-weight:700; cursor:pointer; font-size:15px; }
.cart-row { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid #eee; font-size:14px; }
/* === ЭКРАН ЗАЯВОК === */
.req-item { background:#fff; border-radius:14px; padding:14px; margin:10px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
.req-line1 { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.req-num { font-weight:800; font-size:15px; }
.req-sum { font-weight:800; color:var(--primary); white-space:nowrap; }
.req-meta { font-size:12px; color:#777; margin-top:4px; }
.req-actions { display:flex; gap:8px; margin-top:10px; }
.sm { flex:1; padding:9px; border-radius:10px; border:none; font-weight:700; cursor:pointer; font-size:13px; }
.sm.open { background:var(--primary); color:#fff; }
.sm.del { background:#fbe9e7; color:var(--danger); }
/* === НАКЛАДНАЯ === */
.inv-wrap { background:#fff; margin:10px; border-radius:14px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
.inv-title { font-size:17px; font-weight:800; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:12px; }
.inv-line { font-size:14px; margin:6px 0; }
.inv-line b { display:inline-block; width:105px; }
.inv-edit-in { border:1px solid var(--border); border-radius:6px; padding:4px 6px; font-size:14px; width:100%; }
table.inv { width:100%; border-collapse:collapse; margin:10px 0; font-size:13px; }
table.inv th, table.inv td { border:1px solid #333; padding:5px 6px; }
table.inv th { background:#f0f0f0; }
.inv select.cellin { width:100%; border:none; font-size:13px; padding:2px; }
td.num, th.num { text-align:right; white-space:nowrap; }
td.c { text-align:center; }
.inv input.cellin { width:100%; border:none; font-size:13px; text-align:right; padding:2px; }
.inv input.namein { text-align:left; }
.inv-total { text-align:right; font-size:15px; font-weight:800; padding:6px 8px; }
.inv-total small { font-weight:400; color:#555; font-size:13px; }
.inv-words { font-weight:700; font-size:14px; border-bottom:2px solid #000; padding:8px 0; }
.inv-sign { display:flex; justify-content:space-between; gap:14px; margin-top:18px; font-size:14px; flex-wrap:wrap; }
.inv-sign .sig { flex:1; min-width:130px; border-bottom:1px solid #000; padding-bottom:2px; }
.inv-sign .fio { font-size:13px; color:#555; }
.inv-actions { display:flex; flex-wrap:wrap; gap:8px; margin:12px 10px 0; }
.inv-actions .sm { flex:1 1 40%; }
.sm.grey { background:#eceff1; color:#333; }
.sm.blue { background:var(--primary); color:#fff; }
.sm.green { background:var(--ok); color:#fff; }
@media print {
  body * { visibility:hidden; }
  #inv-print, #inv-print * { visibility:visible; }
  #inv-print { position:absolute; left:0; top:0; width:100%; margin:0; border-radius:0; box-shadow:none; padding:8mm; }
  .inv-actions, header, .top-bar, .fab, .toast, .overlay, .modal { display:none !important; }
}
</style>
</head>
<body>

<!-- ЭКРАН: КАТАЛОГ -->
<div id="screen-catalog">
<header>
  <div style="flex:1"><h1>Каталог оптовых цен</h1><div class="subtitle">Цены оптовые, без НДС, с доставкой</div></div>
</header>
<div class="top-bar">
  <button class="btn-nav" onclick="openCart()">🛒 Корзина <span class="badge" id="cart-count">0</span></button>
  <button class="btn-nav" onclick="openRequests()">📋 Заявки <span class="badge" id="req-count">0</span></button>
</div>
<div class="controls">
  <select id="cat-filter" onchange="applyFilters()"><option value="">Все категории</option></select>
  <input type="text" id="search" placeholder="🔍 Поиск товара" oninput="applyFilters()">
</div>
<div class="product-list" id="plist"></div>
<button class="morebtn hidden" id="morebtn" onclick="showMore()">Показать ещё</button>
<button class="fab" onclick="openSettings()">⚙️</button>
</div>

<!-- ЭКРАН: СПИСОК ЗАЯВОК -->
<div id="screen-requests" class="hidden">
<header>
  <button class="back-btn" onclick="showCatalog()">‹</button>
  <div style="flex:1"><h1>Заявки и накладные</h1><div class="subtitle" id="req-sub">Всего: 0</div></div>
</header>
<div id="req-list"></div>
</div>

<!-- ЭКРАН: НАКЛАДНАЯ -->
<div id="screen-invoice" class="hidden">
<header>
  <button class="back-btn" onclick="showRequests()">‹</button>
  <div style="flex:1"><h1 id="inv-head">Накладная</h1></div>
</header>
<div class="inv-wrap" id="inv-print"></div>
<div class="inv-actions" id="inv-actions"></div>
</div>

<div class="overlay" id="ovl" onclick="closeAllModals()"></div>

<div class="modal" id="modal-cart">
  <button class="mclose" onclick="closeAllModals()">×</button>
  <h3>Корзина</h3>
  <div id="cart-body"></div>
  <div style="display:flex;justify-content:space-between;font-weight:800;margin:12px 0;"><span>Итого:</span><span id="cart-total">0,00 ₽</span></div>
  <button class="mbtn" onclick="createOrder()">Оформить заявку (накладную)</button>
</div>

<div class="modal" id="modal-settings">
  <button class="mclose" onclick="closeAllModals()">×</button>
  <h3>Настройки накладных</h3>
  <div class="fg"><label>Поставщик</label><input id="st-supplier" placeholder="поставщик"></div>
  <div class="fg"><label>Покупатель</label><input id="st-buyer" placeholder="Натали"></div>
  <div class="fg"><label>Отпустил (ФИО)</label><input id="st-released" placeholder="Межлумян Л.Г."></div>
  <div class="fg"><label>Следующий номер накладной</label><input id="st-next" type="number" placeholder="35157"></div>
  <button class="mbtn" onclick="saveSettings()">Сохранить</button>
</div>

<div class="toast" id="toast"></div>

/* ===== ХРАНИЛИЩЕ (совместимо со старыми ключами) ===== */
function lsGet(keys) {
  for (var i = 0; i < keys.length; i++) {
    try {
      var raw = localStorage.getItem(keys[i]);
      if (raw !== null && raw !== '') { var v = JSON.parse(raw); if (v) return v; }
    } catch (e) {}
  }
  return null;
}
var cart = lsGet(['catalog_cart', 'katalog_cart']) || {};
var orders = lsGet(['catalog_requests', 'katalog_requests', 'orders_list']) || [];
if (!Array.isArray(orders)) orders = [];
var settings = lsGet(['catalog_order_settings', 'katalog_order_settings']) || {};

function saveCart() { localStorage.setItem('catalog_cart', JSON.stringify(cart)); }
function saveOrders() { localStorage.setItem('catalog_requests', JSON.stringify(orders)); }
function saveSettings() { localStorage.setItem('catalog_order_settings', JSON.stringify(settings)); }

/* ===== ДАННЫЕ ===== */
var allProducts = [];
(function () {
  var i = 0;
  CATALOG.groups.forEach(function (g) {
    g.items.forEach(function (it) {
      allProducts.push({ id: it.id || ('p' + (i)), name: it.name, price: it.price, category: g.name, unit: it.unit || 'шт' });
      i++;
    });
  });
  var seen = {};
  allProducts = allProducts.filter(function (p) {
    if (seen[p.id]) { p.id = 'px' + (i++); }
    seen[p.id] = true; return true;
  });
})();
var byId = {};
allProducts.forEach(function (p) { byId[p.id] = p; });

/* ===== ЭКРАНЫ ===== */
function show(id) {
  ['screen-catalog', 'screen-requests', 'screen-invoice'].forEach(function (s) {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
  window.scrollTo(0, 0);
}
function showCatalog() { show('screen-catalog'); }
function showRequests() { renderRequests(); show('screen-requests'); }

/* ===== КАТАЛОГ ===== */
var PAGE = 40, shown = PAGE, viewList = [];
function renderCategories() {
  var sel = document.getElementById('cat-filter');
  sel.innerHTML = '<option value="">Все категории</option>';
  CATALOG.groups.forEach(function (g) {
    var o = document.createElement('option'); o.value = g.name; o.textContent = g.name; sel.appendChild(o);
  });
}
function applyFilters() { shown = PAGE; renderProducts(); }
function filtered() {
  var cat = document.getElementById('cat-filter').value;
  var q = document.getElementById('search').value.trim().toLowerCase();
  return allProducts.filter(function (p) {
    if (cat && p.category !== cat) return false;
    if (q && p.name.toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function renderProducts() {
  viewList = filtered();
  var c = document.getElementById('plist');
  c.innerHTML = '';
  viewList.slice(0, shown).forEach(function (p) { c.appendChild(card(p)); });
  var mb = document.getElementById('morebtn');
  if (viewList.length > shown) {
    mb.classList.remove('hidden');
    mb.textContent = 'Показать ещё (' + Math.min(PAGE, viewList.length - shown) + ' из ' + (viewList.length - shown) + ')';
  } else mb.classList.add('hidden');
  if (!viewList.length) c.innerHTML = '<p class="status">Товары не найдены</p>';
}
function showMore() { shown += PAGE; renderProducts(); }
function card(p) {
  var d = document.createElement('div'); d.className = 'pcard';
  var qty = cart[p.id] || 0;
  d.innerHTML = '<div class="pimg">📦</div>'
    + '<div class="pinfo"><div class="pname">' + esc(p.name) + '</div>'
    + '<div class="pcat">' + esc(p.category) + '</div>'
    + '<div class="pprice">' + fmt(p.price) + ' ₽/' + p.unit + '</div></div>'
    + '<div class="rcol"><div class="qty">'
    + '<button class="qbtn" data-a="-1" data-id="' + p.id + '">−</button>'
    + '<input class="qin" type="number" min="0" step="any" value="' + qty + '" data-in="' + p.id + '">'
    + '<button class="qbtn" data-a="1" data-id="' + p.id + '">+</button></div>'
    + '<button class="addbtn" data-add="' + p.id + '">В корзину</button></div>';
  return d;
}
document.addEventListener('click', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.a) changeQty(t.dataset.id, parseInt(t.dataset.a, 10));
  else if (t.dataset && t.dataset.add) {
    var inp = document.querySelector('[data-in="' + t.dataset.add + '"]');
    var q = parseFloat((inp && inp.value) || 0) || 0;
    if (q <= 0) { toast('Укажите количество'); return; }
    cart[t.dataset.add] = q; saveCart(); updCounts(); toast('Добавлено в корзину');
  }
});
document.addEventListener('change', function (e) {
  if (e.target.dataset && e.target.dataset.in) setQty(e.target.dataset.in, e.target.value);
});
function changeQty(id, d) {
  var q = (cart[id] || 0) + d;
  if (q < 0) q = 0;
  if (q === 0) delete cart[id]; else cart[id] = q;
  saveCart(); updCounts(); renderProducts();
}
function setQty(id, v) {
  var q = parseFloat(String(v).replace(',', '.')) || 0;
  if (q <= 0) delete cart[id]; else cart[id] = q;
  saveCart(); updCounts();
}

/* ===== КОРЗИНА ===== */
function updCounts() {
  var n = 0; for (var k in cart) n += cart[k];
  document.getElementById('cart-count').textContent = n;
  document.getElementById('req-count').textContent = orders.length;
}
function openCart() {
  var body = document.getElementById('cart-body');
  var keys = Object.keys(cart);
  if (!keys.length) { toast('Корзина пуста — укажите количество и нажмите «В корзину»'); return; }
  body.innerHTML = '';
  var total = 0;
  keys.forEach(function (id) {
    var p = byId[id]; if (!p) return;
    var sum = p.price * cart[id]; total += sum;
    var row = document.createElement('div'); row.className = 'cart-row';
    row.innerHTML = '<span style="flex:1">' + esc(p.name) + '</span>'
      + '<span>' + cart[id] + ' ' + p.unit + '</span><span style="white-space:nowrap">' + fmt(sum) + ' ₽</span>';
    body.appendChild(row);
  });
  document.getElementById('cart-total').textContent = fmt(total) + ' ₽';
  openModal('modal-cart');
}

/* ===== ЗАЯВКИ = НАКЛАДНЫЕ ===== */
function nextNumber() {
  var n = parseInt(settings.nextInvoice, 10);
  if (!n || n < 1) n = 35157;
  return n;
}
function createOrder() {
  var keys = Object.keys(cart);
  if (!keys.length) return;
  var items = keys.map(function (id) {
    var p = byId[id];
    return { name: p.name, qty: cart[id], unit: p.unit, price: p.price };
  });
  var num = nextNumber();
  var order = {
    id: 'o' + Date.now(),
    num: num,
    date: new Date().toISOString().slice(0, 10).split('-').reverse().join('.'),
    supplier: settings.supplier || 'поставщик',
    buyer: settings.buyer || '',
    releasedBy: settings.releasedBy || 'Межлумян Л.Г.',
    receivedBy: '',
    items: items,
    total: items.reduce(function (s, it) { return s + it.qty * it.price; }, 0)
  };
  orders.unshift(order);
  saveOrders();
  settings.nextInvoice = num + 1;
  saveSettings();
  cart = {}; saveCart();
  closeAllModals(); updCounts();
  toast('Заявка № ' + num + ' сохранена');
  openInvoice(order.id);
}
function openRequests() { showRequests(); }
function renderRequests() {
  var c = document.getElementById('req-list');
  document.getElementById('req-sub').textContent = 'Всего: ' + orders.length;
  c.innerHTML = '';
  if (!orders.length) {
    c.innerHTML = '<p class="status">Заявок пока нет.<br>Добавьте товары в корзину и нажмите «Оформить заявку».</p>';
    return;
  }
  orders.forEach(function (o) {
    var d = document.createElement('div'); d.className = 'req-item';
    d.innerHTML = '<div class="req-line1"><span class="req-num">Реализация товаров № ' + o.num + '</span>'
      + '<span class="req-sum">' + fmt(o.total) + ' ₽</span></div>'
      + '<div class="req-meta">от ' + esc(o.date) + ' · позиций: ' + o.items.length
      + ' · ' + esc(o.buyer || 'покупатель не указан') + '</div>'
      + '<div class="req-actions"><button class="sm open" data-open="' + o.id + '">Открыть накладную</button>'
      + '<button class="sm del" data-del="' + o.id + '">Удалить</button></div>';
    c.appendChild(d);
  });
}
document.addEventListener('click', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.open) openInvoice(t.dataset.open);
  else if (t.dataset && t.dataset.del) {
    if (confirm('Удалить заявку?')) {
      orders = orders.filter(function (o) { return o.id !== t.dataset.del; });
      saveOrders(); updCounts(); renderRequests(); toast('Заявка удалена');
    }
  }
});

/* ===== ПРОСМОТР / РЕДАКТИРОВАНИЕ НАКЛАДНОЙ ===== */
var curId = null, editMode = false;
function findOrder(id) { return orders.filter(function (o) { return o.id === id; })[0]; }
function openInvoice(id) { curId = id; editMode = false; renderInvoice(); show('screen-invoice'); }
function sumOf(o) { return o.items.reduce(function (s, it) { return s + num(it.qty) * num(it.price); }, 0); }
function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; }

function renderInvoice() {

  var total = 0, cnt = 0;

    h += '<tr><td class="c">' + (idx + 1) + '</td><td>'
      + (editMode ? '<input class="cellin namein" data-i="' + idx + '" data-f="name" value="' + escAttr(it.name) + '">' : esc(it.name))
      + '</td><td class="num">'
      + (editMode ? '<input class="cellin" data-i="' + idx + '" data-f="qty" value="' + q + '">' : fmtQty(q))
      + '</td><td class="c">'
      + (editMode ? '<select class="cellin" data-i="' + idx + '" data-f="unit"><option' + (it.unit === 'шт' ? ' selected' : '') + '>шт</option><option' + (it.unit === 'кг' ? ' selected' : '') + '>кг</option></select>' : esc(it.unit))
      + '</td><td class="num">'
      + (editMode ? '<input class="cellin" data-i="' + idx + '" data-f="price" value="' + pr + '">' : fmt(pr))

  var c = document.getElementById('inv-print');

  c.querySelectorAll('.cellin').forEach(function (inp) {
    inp.addEventListener('input', function () {
      var i = parseInt(inp.dataset.i, 10), f = inp.dataset.f;
      if (f === 'qty' || f === 'price') {
        o.items[i][f] = num(inp.value);
      } else if (f === 'unit') {
        o.items[i].unit = inp.value;
      } else {
        o.items[i][f] = inp.value;
      }
      var rows = c.querySelectorAll('tr');
      if (f === 'qty' || f === 'price') {
        var q = num(o.items[i].qty), pr = num(o.items[i].price);
        var cells = rows[i + 1].querySelectorAll('td');
        cells[5].textContent = fmt(q * pr);
        var t = sumOf(o);
        c.querySelector('.inv-total').innerHTML = 'Итого: ' + fmt(t) + '<br><small>В том числе НДС: 0,00</small>';
        c.querySelector('.inv-line[style]').textContent = 'Всего наименований ' + o.items.length + ', на сумму ' + fmt(t) + ' руб.';
        c.querySelector('.inv-words').textContent = rubWords(t);
      }
    });
  });
  c.querySelectorAll('select.cellin').forEach(function (sel) {
    sel.addEventListener('change', function () {
      o.items[parseInt(sel.dataset.i, 10)].unit = sel.value;
    });
  });
  var a = document.getElementById('inv-actions');
  a.innerHTML = editMode
    ? '<button class="sm green" onclick="saveInvoice()">💾 Сохранить</button><button class="sm grey" onclick="cancelEdit()">Отмена</button>'
    : '<button class="sm blue" onclick="editInvoice()">✏️ Редактировать</button>'
    + '<button class="sm blue" onclick="window.print()">🖨 Печать / PDF</button>'
    + '<button class="sm grey" onclick="downloadInvoice()">⬇ Скачать</button>'
    + '<button class="sm grey" onclick="emailInvoice()">✉ Email</button>'
    + '<button class="sm grey" onclick="shareInvoice()">↗ Поделиться</button>'
    + '<button class="sm grey" onclick="export1C()">📊 Экспорт для 1С</button>';
}
function editInvoice() { editMode = true; renderInvoice(); }
function cancelEdit() { editMode = false; renderInvoice(); }
function saveInvoice() {
  var o = findOrder(curId); if (!o) return;
  var g = function (id) { var el = document.getElementById(id); return el ? el.value : null; };
  var s = g('ed-supplier'); if (s !== null) o.supplier = s;
  var b = g('ed-buyer'); if (b !== null) o.buyer = b;
  var r = g('ed-released'); if (r !== null) o.releasedBy = r;
  var rc = g('ed-received'); if (rc !== null) o.receivedBy = rc;
  o.total = sumOf(o);
  saveOrders(); editMode = false; renderInvoice(); updCounts(); toast('Накладная сохранена');
}

/* ===== ЭКСПОРТ И ОТПРАВКА ===== */
function invHtml(o) {
  var rows = o.items.map(function (it, i) {
    return '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(it.name) + '</td><td class="num">' + fmtQty(num(it.qty)) + '</td><td class="c">' + esc(it.unit) + '</td><td class="num">' + fmt(num(it.price)) + '</td><td class="num">' + fmt(num(it.qty) * num(it.price)) + '</td></tr>';
  }).join('');
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Реализация товаров № ' + o.num + '</title>'
    + '<style>body{font-family:Arial,sans-serif;max-width:800px;margin:20px auto;} .t{font-size:18px;font-weight:bold;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px;} table{width:100%;border-collapse:collapse;font-size:14px;} th,td{border:1px solid #333;padding:5px 7px;} th{background:#f0f0f0;} .n{text-align:right;white-space:nowrap;} .c{text-align:center;} .tot{text-align:right;font-size:16px;font-weight:bold;padding:6px 8px;} .w{font-weight:bold;border-bottom:2px solid #000;padding:8px 0;} .sig{display:flex;justify-content:space-between;margin-top:24px;font-size:15px;} .s{flex:1;border-bottom:1px solid #000;margin:0 10px 0 6px;display:inline-block;min-width:120px;} .f{font-size:13px;color:#555;}</style></head><body>'
    + '<div class="t">Реализация товаров № ' + o.num + ' от ' + esc(o.date) + ' г.</div>'
    + '<p>Поставщик: <b>' + esc(o.supplier) + '</b></p><p>Покупатель: <b>' + esc(o.buyer) + '</b></p>'
    + '<table><tr><th>№</th><th>Товар</th><th>Кол-во</th><th>Ед.</th><th>Цена</th><th>Сумма</th></tr>' + rows + '</table>'
    + '<div class="tot">Итого: ' + fmt(o.total) + '<br><span style="font-weight:normal;font-size:13px">В том числе НДС: 0,00</span></div>'
    + '<p style="font-size:13px">Всего наименований ' + o.items.length + ', на сумму ' + fmt(o.total) + ' руб.</p>'
    + '<div class="w">' + rubWords(o.total) + '</div>'
    + '<div class="sig"><span>Отпустил <span class="s"></span><span class="f">' + esc(o.releasedBy) + '</span></span><span>Получил <span class="s"></span><span class="f">' + esc(o.receivedBy) + '</span></span></div>'
    + '</body></html>';
}
function invText(o) {
  var lines = ['Реализация товаров № ' + o.num + ' от ' + o.date + ' г.', 'Поставщик: ' + o.supplier, 'Покупатель: ' + o.buyer, ''];
  o.items.forEach(function (it, i) {
    lines.push((i + 1) + '. ' + it.name + ' — ' + fmtQty(num(it.qty)) + ' ' + it.unit + ' × ' + fmt(num(it.price)) + ' = ' + fmt(num(it.qty) * num(it.price)) + ' ₽');
  });
  lines.push('', 'Итого: ' + fmt(o.total) + ' ₽ (НДС: 0)', 'Всего наименований ' + o.items.length + ', на сумму ' + fmt(o.total) + ' руб.', rubWords(o.total), '', 'Отпустил: ' + o.releasedBy, 'Получил: ' + o.receivedBy);
  return lines.join('\n');
}
function downloadInvoice() {
  var o = findOrder(curId); if (!o) return;
  var blob = new Blob([invHtml(o)], { type: 'text/html;charset=utf-8' });
  dl(URL.createObjectURL(blob), 'nakladnaya_' + o.num + '.html');
}
function dl(url, name) {
  var a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function emailInvoice() {
  var o = findOrder(curId); if (!o) return;
  var t = invText(o);
  window.location.href = 'mailto:?subject=' + encodeURIComponent('Накладная № ' + o.num + ' от ' + o.date) + '&body=' + encodeURIComponent(t.slice(0, 1800));
}
function shareInvoice() {
  var o = findOrder(curId); if (!o) return;
  var t = invText(o);
  if (navigator.share) {
    navigator.share({ title: 'Накладная № ' + o.num, text: t }).catch(function () {});
  } else {
    if (navigator.clipboard) navigator.clipboard.writeText(t);
    toast('Текст накладной скопирован');
  }
}
function export1C() {
  var o = findOrder(curId); if (!o) return;
  var d = o.date.split('.');
  var xml = '<?xml version="1.0" encoding="UTF-8"?>\n<КоммерческаяИнформация ВерсияСхемы="2.07" ДатаФормирования="' + d[2] + '-' + d[1] + '-' + d[0] + '">\n<Документ>\n <ИдНомер>' + o.num + '</ИдНомер>\n <НомерДок>' + o.num + '</НомерДок>\n <ДатаДок>' + d[2] + '-' + d[1] + '-' + d[0] + '</ДатаДок>\n <Наименование>Реализация товаров</Наименование>\n <Контрагенты>\n  <Контрагент>\n   <Наименование>' + xesc(o.buyer || 'Покупатель') + '</Наименование>\n   <Роль>Покупатель</Роль>\n  </Контрагент>\n  <Контрагент>\n   <Наименование>' + xesc(o.supplier) + '</Наименование>\n   <Роль>Поставщик</Роль>\n  </Контрагент>\n </Контрагенты>\n <Товары>\n';
  o.items.forEach(function (it) {
    xml += '  <Товар>\n   <Наименование>' + xesc(it.name) + '</Наименование>\n   <Количество>' + String(num(it.qty)).replace('.', ',') + '</Количество>\n   <Единица>' + it.unit + '</Единица>\n   <ЦенаЗаЕдиницу>' + String(num(it.price)).replace('.', ',') + '</ЦенаЗаЕдиницу>\n   <Сумма>' + String(num(it.qty) * num(it.price)).replace('.', ',') + '</Сумма>\n  </Товар>\n';
  });
  xml += ' </Товары>\n <СуммаДокумента>' + String(o.total).replace('.', ',') + '</СуммаДокумента>\n</Документ>\n</КоммерческаяИнформация>';
  var blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
  dl(URL.createObjectURL(blob), 'nakladnaya_' + o.num + '_1C.xml');
}

/* ===== НАСТРОЙКИ ===== */
function openSettings() {
  document.getElementById('st-supplier').value = settings.supplier || 'поставщик';
  document.getElementById('st-buyer').value = settings.buyer || '';
  document.getElementById('st-released').value = settings.releasedBy || 'Межлумян Л.Г.';
  document.getElementById('st-next').value = settings.nextInvoice || nextNumber();
  openModal('modal-settings');
}
function saveSettings() {
  settings.supplier = document.getElementById('st-supplier').value.trim() || 'поставщик';
  settings.buyer = document.getElementById('st-buyer').value.trim();
  settings.releasedBy = document.getElementById('st-released').value.trim();
  settings.nextInvoice = parseInt(document.getElementById('st-next').value, 10) || nextNumber();
  saveSettings(); closeAllModals(); toast('Настройки сохранены');
}

/* ===== МОДАЛКИ / УТИЛИТЫ ===== */
function openModal(id) { document.getElementById('ovl').classList.add('active'); document.getElementById(id).classList.add('active'); }
function closeAllModals() {
  document.getElementById('ovl').classList.remove('active');
  document.querySelectorAll('.modal').forEach(function (m) { m.classList.remove('active'); });
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAllModals(); });
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2500);
}
function fmt(v) { return num(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fmtQty(v) {
  var n = num(v);
  return (n % 1 === 0 ? n.toFixed(0) : n.toFixed(3)).replace('.', ',');
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function escAttr(s) { return esc(s); }
function xesc(s) { return esc(s); }

/* сумма прописью */
function rubWords(v) {
  var n = Math.floor(num(v)), kop = Math.round((num(v) - n) * 100);
  if (n === 0 && kop === 0) return 'Ноль рублей 00 копеек';
  var u1 = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
  var uf = ['', 'одна', 'две'];
  var u2 = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
  var u3 = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
  var u4 = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот'];
  function tri(x, fem) {
    var s = [];
    var h = Math.floor(x / 100) % 10, t = Math.floor(x / 10) % 10, o = x % 10;
    if (h) s.push(u4[h]);
    if (t === 1) s.push(u2[o]);
    else { if (t) s.push(u3[t]); s.push(fem && o <= 2 ? uf[o] : u1[o]); }
    return s.filter(Boolean).join(' ');
  }
  function form(x, forms) {
    var m100 = x % 100, m10 = x % 10;
    if (m100 >= 11 && m100 <= 14) return forms[2];
    if (m10 === 1) return forms[0];
    if (m10 >= 2 && m10 <= 4) return forms[1];
    return forms[2];
  }
  var parts = [];
  var mln = Math.floor(n / 1000000) % 1000, th = Math.floor(n / 1000) % 1000, rest = n % 1000;
  if (mln) parts.push(tri(mln, false) + ' ' + form(mln, ['миллион', 'миллиона', 'миллионов']));
  if (th) parts.push(tri(th, true) + ' ' + form(th, ['тысяча', 'тысячи', 'тысяч']));
  if (rest) parts.push(tri(rest, false));
  if (!n && kop) parts.push('ноль');
  var s = parts.join(' ') + ' ' + form(n, ['рубль', 'рубля', 'рублей']) + ' ' + String(kop).padStart(2, '0') + ' копеек';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

  renderCategories();
  renderProducts();
  updCounts();
});
